<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picun F8 Ultra 降噪控制器</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --danger: #ef4444;
      --btn-bg: #1e293b;
      --btn-hover: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .title-box h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }
    .title-box p {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .status-badge {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge.connected {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 18px 0 10px 0;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    button {
      background: var(--btn-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    button:hover:not(:disabled) {
      background: var(--btn-hover);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .primary-btn {
      width: 100%;
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      flex-direction: row;
      justify-content: center;
      padding: 14px;
      font-size: 15px;
    }
    .primary-btn:hover:not(:disabled) {
      background: var(--accent-hover);
      color: #fff;
    }

    .info-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 20px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      color: var(--text-dim);
    }
    .info-card span {
      color: var(--text);
      font-weight: 600;
    }

    .log-box {
      margin-top: 16px;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      height: 120px;
      overflow-y: auto;
      color: #94a3b8;
      line-height: 1.5;
    }
    .log-line {
      margin-bottom: 4px;
      word-break: break-all;
    }
    .log-tx { color: #38bdf8; }
    .log-rx { color: #4ade80; }
    .log-err { color: #f87171; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-box">
        <h1>Picun F8 Ultra 控制器</h1>
        <p>基于官方 BLE 协议逆向定制</p>
      </div>
      <div id="statusBadge" class="status-badge">
        <span class="status-dot"></span>
        <span id="statusText">未连接</span>
      </div>
    </div>

    <!-- 连接按钮 -->
    <button id="btnConnect" class="primary-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"/></svg>
      连接耳机 (BLE)
    </button>

    <!-- 降噪模式 -->
    <div class="section-title">降噪模式 (ANC)</div>
    <div class="grid-3">
      <button id="btnOff" disabled>
        <span>普通模式</span>
        <span style="font-size: 11px; color: var(--text-dim);">关闭降噪</span>
      </button>
      <button id="btnAnc" disabled>
        <span>降噪模式</span>
        <span style="font-size: 11px; color: var(--text-dim);">深度降噪</span>
      </button>
      <button id="btnTrans" disabled>
        <span>通透模式</span>
        <span style="font-size: 11px; color: var(--text-dim);">环境音透传</span>
      </button>
    </div>

    <!-- 扩展特性 -->
    <div class="section-title">功能控制</div>
    <div class="grid-2">
      <button id="btnBass" disabled>
        <span>低音增强</span>
        <span id="txtBass" style="font-size: 11px; color: var(--text-dim);">已关闭</span>
      </button>
      <button id="btnWind" disabled>
        <span>防风降噪</span>
        <span id="txtWind" style="font-size: 11px; color: var(--text-dim);">已关闭</span>
      </button>
      <button id="btnGame" disabled>
        <span>低延迟游戏模式</span>
        <span id="txtGame" style="font-size: 11px; color: var(--text-dim);">已关闭</span>
      </button>
      <button id="btnSpatial" disabled>
        <span>空间音频</span>
        <span id="txtSpatial" style="font-size: 11px; color: var(--text-dim);">已关闭</span>
      </button>
    </div>

    <!-- 设备信息 -->
    <div class="info-card">
      <div>当前状态: <span id="infoCurrentMode">--</span></div>
      <div>耳机电量: <span id="infoBattery">--</span></div>
    </div>

    <!-- 协议数据日志 -->
    <div class="section-title">通信日志 (TX / RX)</div>
    <div id="logBox" class="log-box">
      <div class="log-line">就绪：请确保耳机已开启并连接 Mac 蓝牙，然后点击“连接耳机”。</div>
    </div>
  </div>

  <script>
    // 逆向自品存官方 App (uni.UNIDB2EFEB.apk) 的 BLE 核心常量
    const SERVICE_UUID = "0000ecd0-22ed-ccdb-79c7-71482b33c801";
    const WRITE_CHAR_UUID = "0000ecd2-22ed-ccdb-79c7-71482b33c801";
    const NOTIFY_CHAR_UUID = "0000ecd1-22ed-ccdb-79c7-71482b33c801";

    // CRC8 Maxim 校验码算法 (提取自 APK BluetoothPlugin.js)
    const CRC8_TABLE = [
      0,94,188,226,97,63,221,131,194,156,126,32,163,253,31,65,
      157,195,33,127,252,162,64,30,95,1,227,189,62,96,130,220,
      35,125,159,193,66,28,254,160,225,191,93,3,128,222,60,98,
      190,224,2,92,223,129,99,61,124,34,192,158,29,67,161,255,
      70,24,250,164,39,121,155,197,132,218,56,102,229,187,89,7,
      219,133,103,57,186,228,6,88,25,71,165,251,120,38,196,154,
      101,59,217,135,4,90,184,230,167,249,27,69,198,152,122,36,
      248,166,68,26,153,199,37,123,58,100,134,216,91,5,231,185,
      140,210,48,110,237,179,81,15,78,16,242,172,47,113,147,205,
      17,79,173,243,112,46,204,146,211,141,111,49,178,236,14,80,
      175,241,19,77,206,144,114,44,109,51,209,143,12,82,176,238,
      50,108,142,208,83,13,239,177,240,174,76,18,145,207,45,115,
      202,148,118,40,171,245,23,73,8,86,180,234,105,55,213,139,
      87,9,235,181,54,104,138,212,149,203,41,119,244,170,72,22,
      233,183,85,11,136,214,52,106,43,117,151,201,74,20,246,168,
      116,42,200,150,21,75,169,247,182,232,10,84,215,137,107,53
    ];

    function calcCrc8Maxim(byteArray) {
      let r = 0;
      for (let i = 0; i < byteArray.length; i++) {
        r = CRC8_TABLE[r ^ byteArray[i]];
      }
      return r;
    }

    // 构造官方协议报文 [0xFC, 0xFA, LENGTH, CMD, PAYLOAD..., CRC8]
    function buildPacket(cmdByte, payload = []) {
      const header = [0xFC, 0xFA, payload.length, cmdByte, ...payload];
      const crc = calcCrc8Maxim(header);
      return new Uint8Array([...header, crc]);
    }

    function toHexStr(uint8Arr) {
      return Array.from(uint8Arr).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
    }

    let bluetoothDevice = null;
    let writeChar = null;
    let notifyChar = null;

    // 状态缓存
    let state = {
      bassBoost: false,
      windproof: false,
      gameMode: false,
      spatial: false
    };

    const logBox = document.getElementById('logBox');
    function log(msg, type = 'info') {
      const div = document.createElement('div');
      div.className = `log-line log-${type}`;
      const time = new Date().toTimeString().split(' ')[0];
      div.textContent = `[${time}] ${msg}`;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function sendCommand(cmdByte, payload = [], desc = '') {
      if (!writeChar) {
        log('错误: 尚未连接到耳机', 'err');
        return;
      }
      const packet = buildPacket(cmdByte, payload);
      try {
        await writeChar.writeValue(packet);
        log(`TX (${desc}): ${toHexStr(packet)}`, 'tx');
      } catch (err) {
        log(`TX 发送失败: ${err.message}`, 'err');
      }
    }

    // 响应解析 (Notify)
    function handleNotification(event) {
      const value = event.target.value;
      const bytes = new Uint8Array(value.buffer);
      log(`RX: ${toHexStr(bytes)}`, 'rx');

      // 格式: [FC, FA, len, cmd, data..., crc]
      if (bytes.length >= 4 && bytes[0] === 0xFC && bytes[1] === 0xFA) {
        const len = bytes[2];
        const cmd = bytes[3];
        const data = bytes.slice(4, 4 + len);

        // 0x76: 降噪模式状态响应
        if (cmd === 0x76 && data.length >= 1) {
          const mode = data[0]; // 0: 普通, 1: 降噪, 2: 通透
          updateAncUI(mode);
        }
        // 0x74: 电量响应
        else if (cmd === 0x74) {
          const b0 = data[0] || 0;
          const b1 = data[1] || 0;
          const b2 = data[2] || 0;
          const b3 = data[3] || 0;

          const left = (b0 && b1 !== 0 && b1 !== 255 && b1 <= 100) ? b1 : null;
          const right = (b2 && b3 !== 0 && b3 !== 255 && b3 <= 100) ? b3 : null;

          let batteryStr = '--';
          if (left !== null && right !== null) {
            batteryStr = (left === right) ? `${left}%` : `L:${left}% R:${right}%`;
          } else if (left !== null) {
            batteryStr = `${left}%`;
          } else if (right !== null) {
            batteryStr = `${right}%`;
          } else if (data.length === 1 && data[0] > 0 && data[0] <= 100) {
            batteryStr = `${data[0]}%`;
          } else {
            for (let i = 0; i < data.length; i++) {
              if (data[i] > 1 && data[i] <= 100 && data[i] !== 255) {
                batteryStr = `${data[i]}%`;
                break;
              }
            }
          }
          document.getElementById('infoBattery').textContent = batteryStr;
        }
      }
    }

    function updateAncUI(mode) {
      document.getElementById('btnOff').classList.toggle('active', mode === 0);
      document.getElementById('btnAnc').classList.toggle('active', mode === 1);
      document.getElementById('btnTrans').classList.toggle('active', mode === 2);

      const labels = ['普通 (降噪关)', '深度降噪 (ANC 开)', '通透模式 (环境音)'];
      document.getElementById('infoCurrentMode').textContent = labels[mode] || `模式 ${mode}`;
    }

    // 连接逻辑
    document.getElementById('btnConnect').onclick = async () => {
      try {
        log('正在搜索周围所有低功耗蓝牙 (BLE) 设备...');
        // 使用 acceptAllDevices: true，避免因为 BLE 广播名称不叫 SW 导致过滤失败
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            SERVICE_UUID,
            "0000ecd0-22ed-ccdb-79c7-71482b33c801",
            "0000ae00-0000-1000-8000-00805f9b34fb"
          ]
        });

        log(`已选择设备: "${bluetoothDevice.name || '未知名称'}" (ID: ${bluetoothDevice.id})，正在建立 GATT 连接...`);
        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

        const server = await bluetoothDevice.gatt.connect();
        log('GATT 连接成功，正在获取服务 0xECD0...');

        const service = await server.getPrimaryService(SERVICE_UUID);
        writeChar = await service.getCharacteristic(WRITE_CHAR_UUID);
        notifyChar = await service.getCharacteristic(NOTIFY_CHAR_UUID);

        // 启动通知监听
        await notifyChar.startNotifications();
        notifyChar.addEventListener('characteristicvaluechanged', handleNotification);
        log('已启用 Notify 状态监听！');

        // 更新 UI
        document.getElementById('statusBadge').classList.add('connected');
        document.getElementById('statusText').textContent = '已连接';
        document.getElementById('btnConnect').textContent = '断开连接';
        document.getElementById('btnConnect').onclick = disconnect;
        document.querySelectorAll('button:not(#btnConnect)').forEach(b => b.disabled = false);

        // 发送查询指令获取初始状态
        setTimeout(() => sendCommand(0x76, [], '查询当前降噪模式'), 200);
        setTimeout(() => sendCommand(0x74, [], '查询当前电量'), 500);

      } catch (err) {
        log(`连接失败或取消: ${err.message}`, 'err');
      }
    };

    function disconnect() {
      if (bluetoothDevice && bluetoothDevice.gatt.connected) {
        bluetoothDevice.gatt.disconnect();
      }
      onDisconnected();
    }

    function onDisconnected() {
      log('蓝牙连接已断开', 'err');
      document.getElementById('statusBadge').classList.remove('connected');
      document.getElementById('statusText').textContent = '未连接';
      document.getElementById('btnConnect').textContent = '连接耳机 (BLE)';
      document.getElementById('btnConnect').onclick = () => location.reload();
      document.querySelectorAll('button:not(#btnConnect)').forEach(b => {
        b.disabled = true;
        b.classList.remove('active');
      });
      document.getElementById('infoCurrentMode').textContent = '--';
      document.getElementById('infoBattery').textContent = '--';
    }

    // 降噪按钮事件绑定 (对应官方 [0x76, mode, 0, depth])
    document.getElementById('btnOff').onclick = () => {
      sendCommand(0x76, [0, 0, 0], '关闭降噪');
      updateAncUI(0);
    };
    document.getElementById('btnAnc').onclick = () => {
      sendCommand(0x76, [1, 0, 14], '开启深度降噪');
      updateAncUI(1);
    };
    document.getElementById('btnTrans').onclick = () => {
      sendCommand(0x76, [2, 0, 14], '开启通透模式');
      updateAncUI(2);
    };

    // 功能开关
    document.getElementById('btnBass').onclick = () => {
      state.bassBoost = !state.bassBoost;
      sendCommand(0x97, [state.bassBoost ? 1 : 0], `低音增强 ${state.bassBoost ? '开' : '关'}`);
      document.getElementById('txtBass').textContent = state.bassBoost ? '已开启' : '已关闭';
      document.getElementById('btnBass').classList.toggle('active', state.bassBoost);
    };

    document.getElementById('btnWind').onclick = () => {
      state.windproof = !state.windproof;
      sendCommand(0x9A, [state.windproof ? 1 : 0], `防风降噪 ${state.windproof ? '开' : '关'}`);
      document.getElementById('txtWind').textContent = state.windproof ? '已开启' : '已关闭';
      document.getElementById('btnWind').classList.toggle('active', state.windproof);
    };

    document.getElementById('btnGame').onclick = () => {
      state.gameMode = !state.gameMode;
      sendCommand(0x78, [state.gameMode ? 1 : 0], `低延迟游戏模式 ${state.gameMode ? '开' : '关'}`);
      document.getElementById('txtGame').textContent = state.gameMode ? '已开启' : '已关闭';
      document.getElementById('btnGame').classList.toggle('active', state.gameMode);
    };

    document.getElementById('btnSpatial').onclick = () => {
      state.spatial = !state.spatial;
      sendCommand(0x79, [state.spatial ? 1 : 0], `空间音频 ${state.spatial ? '开' : '关'}`);
      document.getElementById('txtSpatial').textContent = state.spatial ? '已开启' : '已关闭';
      document.getElementById('btnSpatial').classList.toggle('active', state.spatial);
    };
  </script>
</body>
</html>
